Type=simple
NotifyAccess=none
TimeoutStartSec=infinity
Environment=GAMESCOPE_SPI_TOUCH_INTERNAL=1
Environment=GAMESCOPE_FAKE_OUTPUT_MM=190x118
Environment=STEAM_DISPLAY_REFRESH_LIMITS=24,165
Environment=GAMESCOPE_MANGOAPP=0
