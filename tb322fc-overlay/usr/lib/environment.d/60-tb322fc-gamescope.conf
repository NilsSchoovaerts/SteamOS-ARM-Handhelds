# Lenovo Legion Tab Y700 Gen 4 (TB322FC). The panel is portrait-native
# 1904x3040 (panel-novatek-nt36536.c, csot,pp8807hb1-1); gamescope's auto
# orientation turns it landscape, so no GAMESCOPE_ORIENTATION is forced.

# NT36536 touch is on SPI: tie it to the internal panel (gamescope wlserver.cpp).
GAMESCOPE_SPI_TOUCH_INTERNAL=1
# Physical size of the landscape picture (panel reports 118x190 mm portrait).
GAMESCOPE_FAKE_OUTPUT_MM=190x118
# Panel modes: 24/30/40/60/90/120/144/165 Hz (same range tb322fc-linux sets).
STEAM_DISPLAY_REFRESH_LIMITS=24,165
# Same Adreno 830 + zink mangoapp problem the Odin 3 hit: start with Steam's
# overlay off (in-game MangoHud still works). Set to 1 to try it.
GAMESCOPE_MANGOAPP=0
